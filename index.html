<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cardápio digital de lanches artesanais. Simples, rápido e direto ao ponto.">
  <meta name="theme-color" content="#FBFBFD">
  
  <title>Cardápio Digital</title>

  <link rel="icon" type="image/svg+xml" href="img/icons/favicon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Preload da imagem LCP para pontuação máxima de Performance no Lighthouse -->
  <link rel="preload" as="image" href="img/lanches/classic-smash.webp" type="image/webp" fetchpriority="high">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/cardapio.css">
  <link rel="stylesheet" href="css/carrinho.css">
</head>
<body>

  <!-- BLOCO: CABEÇALHO -->
  <header class="app-header">
    <div class="header-content">
      <div class="header-icone-box">
        <svg class="header-icone-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11h16a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1Z"/>
          <path d="M5 11a7 7 0 0 1 14 0"/>
          <path d="M5 18a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-1a3 3 0 0 0-3-3H8a3 3 0 0 0-3 3Z"/>
          <path d="m7 14 1.5 2"/>
          <path d="m11 14 1.5 2"/>
          <path d="m15 14 1.5 2"/>
        </svg>
      </div>

      <h1 class="app-title">Lanches</h1>
      <p class="app-subtitle">Hambúrgueres artesanais & porções</p>

      <div class="header-info-tags">
        <span class="tag-status">
          <span class="ponto-verde"></span> Aberto agora
        </span>
      </div>
    </div>
  </header>

  <main class="container-vitrine">
    <!-- BLOCO: VITRINE DE PRODUTOS -->
    <section class="secao-produtos">
      <h2 class="secao-titulo">Nossos Lanches</h2>
      <div id="lista-produtos" class="grid-produtos" aria-live="polite"></div>
    </section>

    <!-- BLOCO: CARRINHO (MODAL) -->
    <div id="carrinho-modal">
      <div class="carrinho-header">
        <h2>Seu Pedido</h2>
        <button id="btn-fechar-carrinho">Fechar</button>
      </div>

      <ul id="lista-carrinho"></ul>  

      <div class="carrinho-rodape">
        <span>Total:</span>
        <span id="valor-total">R$ 0,00</span>
      </div>
    </div>
  </main>

  <!-- BLOCO: NAVEGAÇÃO INFERIOR -->
  <nav class="bottom-nav">
    <button id="btn-abrir-carrinho" class="btn-carrinho" type="button" aria-label="Abrir carrinho de compras">
      <div class="btn-carrinho-info">
        <span class="carrinho-icone">🛒</span>
        <span class="carrinho-texto">Ver Carrinho</span>
      </div>
      <span id="carrinho-contador" class="badge-contador">0</span>
    </button>
  </nav>

  <!-- BLOCO: SCRIPTS -->
  <script src="js/produtos.js" defer></script>
  <script src="js/carrinho.js" defer></script>
  <script src="js/whatsapp.js" defer></script>
  <script src="js/app.js" defer></script>

</body>
</html>
